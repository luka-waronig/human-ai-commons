name: Reproducibility checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    defaults:
      run:
        working-directory: iccs2026
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: iccs2026/requirements.txt
      - name: Install pinned environment
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Regenerate historical source reference
        run: python reproducibility/capture_baseline.py
      - name: Test model and estimators
        run: python -m pytest -q
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check dashboard import
        run: python -c "import server"
