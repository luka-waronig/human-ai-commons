[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human-ai-commons"
version = "0.2.0"
description = "Self-contained constrained payoff design experiments for spatial resource commons"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy==2.3.1", "scipy==1.15.3", "matplotlib==3.10.3"]

[project.optional-dependencies]
analysis = ["pandas==2.3.0"]
publication = ["pandas==2.3.0"] # Compatibility with previously distributed environments.
notebooks = ["pandas==2.3.0", "jupyterlab>=4,<5", "ipywidgets==8.1.7", "ipykernel==6.29.5"]
test = ["pytest==8.4.1"]

[project.scripts]
human-ai-commons = "human_ai_commons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
