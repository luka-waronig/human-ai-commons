[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human-ai-commons"
version = "0.2.0"
description = "Self-contained constrained payoff design experiments for spatial resource commons"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.1", "scipy==1.15.3", "matplotlib==3.10.3"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
human-ai-commons = "human_ai_commons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
